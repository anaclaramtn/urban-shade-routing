<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Como o plantio é decidido — recorte</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <style>
    html, body, #map { width: 100%; height: 100%; margin: 0; }
    body { font-family: Arial, sans-serif; }
    #map { background: #fff; }
    .box {
      border: 1px solid #aaa;
      border-radius: 3px;
      background: rgba(255,255,255,.95);
      box-shadow: 0 1px 4px rgba(0,0,0,.16);
    }
    .map-title { padding: 7px 10px; font-size: 14px; font-weight: 700; }
    .load-status { padding: 7px 10px; color: #444; font-size: 12px; }
    .panel { width: 260px; padding: 8px 12px 10px; color: #222; font-size: 12px; }
    .panel summary { cursor: pointer; font-size: 13px; font-weight: 700; }
    .ctrl { margin-top: 8px; }
    .ctrl label { display: flex; justify-content: space-between; align-items: center; margin-bottom: 3px; font-weight: 700; }
    .ctrl input[type=range], .ctrl select { width: 100%; }
    .num { width: 66px; text-align: right; }
    .panel table { width: 100%; margin-top: 9px; border-collapse: collapse; }
    .panel td { padding: 2px 0; }
    .panel td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
    .legend { width: 230px; padding: 8px 10px; color: #333; font-size: 11px; line-height: 1.35; }
    .legend-gradient {
      height: 10px; margin: 5px 0 2px;
      background: linear-gradient(90deg,#440154,#482878,#3e4989,#31688e,#26828e,#1f9e89,#35b779,#6ece58,#b5de2b,#fde725);
    }
    .legend-range { display: flex; justify-content: space-between; }
    .legend-row { display: flex; align-items: center; gap: 7px; margin-top: 6px; }
    .tree-dot { width: 10px; height: 10px; border-radius: 50%; background: #1a9641; border: 1.5px solid #00441b; flex: none; }
    .grey-line { width: 18px; height: 3px; background: #7d8590; flex: none; }
    .rotulo { padding: 3px 6px; font-size: 12px; font-weight: 700; white-space: nowrap; }
    .info { width: 270px; padding: 10px 12px; color: #222; font-size: 12px; line-height: 1.35; }
    .info .dica { color: #555; }
    .info h4 { margin: 0 0 6px; font-size: 14px; }
    .info .numeros { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; }
    .info .numeros div { display: flex; flex-direction: column; }
    .info .numeros span { color: #666; font-size: 11px; }
    .info .numeros strong { font-size: 15px; font-variant-numeric: tabular-nums; }
    .info .extra { margin-top: 7px; color: #666; font-size: 11px; }
    @media (max-width: 650px) { .panel { width: 200px; } .legend { width: 170px; } .info { width: 210px; } }
  </style>
</head>
<body>
  <div id="map" aria-label="Recorte interativo mostrando onde as árvores são plantadas de acordo com o fluxo"></div>
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
  <script src="./plantio_algoritmo.js"></script>
  <script>
    // Recorte de ~1,2 km a oeste do Centro: concentra muitas arestas com árvores
    // em diferentes horários e números de árvores.
    const RECORTE = L.latLngBounds([[-3.7185, -38.5610], [-3.7065, -38.5490]]);

    const map = L.map("map", { preferCanvas: true, maxBounds: RECORTE.pad(.35), maxBoundsViscosity: 1 });
    map.fitBounds(RECORTE);
    map.setMinZoom(map.getZoom());
    L.control.scale().addTo(map);

    [["graph", 350], ["base", 420], ["flow", 450], ["planted", 480], ["trees", 500], ["boundary", 550]].forEach(([name, z]) => {
      map.createPane(name);
      map.getPane(name).style.zIndex = z;
    });
    const render = Object.fromEntries(["base", "flow", "planted", "trees"].map(p => [p, L.canvas({ pane: p, padding: .5, tolerance: 5 })]));
    const fmt = (v, d = 0) => v.toLocaleString("pt-BR", { minimumFractionDigits: d, maximumFractionDigits: d });
    const el = id => document.getElementById(id);

    // ---------------------------------------------------------------------
    // Controles
    // ---------------------------------------------------------------------
    function caixa(posicao, classe, html) {
      const c = L.control({ position: posicao });
      c.onAdd = () => {
        const e = L.DomUtil.create("div", `box ${classe}`);
        e.innerHTML = html;
        L.DomEvent.disableClickPropagation(e);
        L.DomEvent.disableScrollPropagation(e);
        c.element = e;
        return e;
      };
      return c.addTo(map);
    }

    caixa("topleft", "map-title", "Recorte: onde as árvores são plantadas");
    // Painel fixo de detalhes: atualizado ao passar o mouse (ou tocar) numa aresta/árvore.
    const status = caixa("bottomleft", "info", `<span class="dica">Carregando arestas…</span>`);

    caixa("topright", "panel", `
      <details open>
        <summary>Parâmetros</summary>
        <div class="ctrl"><label>Horário <span>7h</span></label></div>
        <div class="ctrl"><label>lₐ <span><input id="la_num" class="num" type="number" min="0.5" step="0.5"> m</span></label>
          <input id="la" type="range" min="1" max="15" step="0.5" value="6"></div>
        <div class="ctrl"><label>N (cidade toda) <input id="n_num" class="num" type="number" min="0" step="1"></label>
          <input id="n" type="range" min="0" max="10000" step="1" value="1000"></div>
        <table>
          <tr><td>Árvores neste recorte</td><td id="r_arvores">—</td></tr>
          <tr><td>Arestas com árvores no recorte</td><td id="r_arestas">—</td></tr>
        </table>
      </details>`);

    const legenda = caixa("bottomright", "legend", `
      <strong>Arestas — log10 do fluxo</strong>
      <div class="legend-gradient"></div>
      <div class="legend-range"><span>−2,51</span><span>3,66</span></div>
      <div class="legend-row"><span class="tree-dot"></span>Árvore plantada</div>
      <div class="legend-row"><span class="grey-line"></span>Aresta com fluxo</div>`);

    // ---------------------------------------------------------------------
    // Camadas
    // ---------------------------------------------------------------------
    const camadas = {
      fundo: L.layerGroup(),
      base: L.layerGroup(),
      fluxo: L.layerGroup(),
      plantadas: L.layerGroup(),
      arvores: L.layerGroup()
    };
    camadas.fundo.addTo(map); camadas.base.addTo(map); camadas.plantadas.addTo(map); camadas.arvores.addTo(map);
    L.control.layers({}, {
      "Rede de pedestres (fundo)": camadas.fundo,
      "Arestas com fluxo (cinza)": camadas.base,
      "Arestas — log10 do fluxo": camadas.fluxo,
      "Arestas que recebem árvores": camadas.plantadas,
      "Árvores plantadas": camadas.arvores
    }, { collapsed: false, position: "topleft" }).addTo(map);

    async function lerTopojson(arquivo) {
      const response = await fetch(`./topojson/${arquivo}`);
      if (!response.ok) throw new Error(`${arquivo}: ${response.status} ${response.statusText}`);
      const topology = await response.json();
      return topojson.feature(topology, topology.objects[Object.keys(topology.objects)[0]]);
    }

    lerTopojson("grafo_fundo.topojson").then(geojson => {
      L.geoJSON(geojson, { pane: "graph", interactive: false, style: () => ({ color: "#bdbdbd", opacity: .7, weight: .8 }) }).addTo(camadas.fundo);
    }).catch(console.error);

    // ---------------------------------------------------------------------
    // Dados e cálculo
    // ---------------------------------------------------------------------
    const viridis = ["#440154", "#482878", "#3e4989", "#31688e", "#26828e", "#1f9e89", "#35b779", "#6ece58", "#b5de2b", "#fde725"];
    function corViridis(t) {
      t = Math.max(0, Math.min(1, t));
      const pos = t * (viridis.length - 1), i = Math.min(viridis.length - 2, Math.floor(pos)), u = pos - i;
      const a = viridis[i].slice(1).match(/.{2}/g).map(x => parseInt(x, 16));
      const b = viridis[i + 1].slice(1).match(/.{2}/g).map(x => parseInt(x, 16));
      return `rgb(${a.map((x, k) => Math.round(x + (b[k] - x) * u)).join(",")})`;
    }

    let D = null, ORDEM = null, NO_RECORTE = [], estado = null, agendado = false;
    // Mesma escala do mapa da Etapa 1 ("Arestas — log10 do fluxo"):
    // log10 de F na cidade inteira, de −2,5081 a 3,6587, paleta viridis.
    const LOG10_MIN = -2.5081, LOG10_MAX = 3.6587;

    // Horário congelado em 7h. Os outros horários (9h a 15h) continuam no TopoJSON;
    // para usá-los, troque esta constante.
    const HORA = 7;
    function chaveSol() { return `s${HORA}`; }

    const plural = (k, um, varios) => `${fmt(k)} ${k === 1 ? um : varios}`;

    let selecionada = null;

    function mostrarInfo(i, arvore) {
      selecionada = { i, arvore };
      const la = +el("la").value, Spct = D.S[chaveSol()][i];
      const sol = (Spct / 100) * D.L[i], cap = capacidade(Spct, D.L[i], la), ni = estado.n[i];

      const titulo = ni === 0 ? "Rua sem árvores"
        : arvore ? `Árvore ${arvore} de ${ni} nesta rua`
        : `Rua com ${plural(ni, "árvore", "árvores")}`;

      status.element.innerHTML = `
        <h4>${titulo}</h4>
        <div class="numeros">
          <div><span>Fluxo</span><strong>${fmt(D.F[i], 2)}</strong><span>log10 ${fmt(Math.log10(D.F[i]), 3)}</span></div>
          <div><span>Árvores plantadas</span><strong>${fmt(ni)}</strong></div>
          <div><span>Metros ao sol (${HORA}h)</span><strong>${fmt(sol, 1)} m</strong></div>
          <div><span>Árvores que cabem</span><strong>${fmt(cap)}</strong></div>
        </div>
        <div class="extra">Comprimento ${fmt(D.L[i], 1)} m · ${fmt(Spct)}% ao sol · aresta ${D.id[i]}</div>`;
    }

    function rotulo(i) {
      const ni = estado.n[i];
      return `Fluxo ${fmt(D.F[i], 0)} · ${ni ? plural(ni, "árvore", "árvores") : "sem árvores"}`;
    }

    function ligarHover(camada, i, arvore) {
      camada.bindTooltip(() => rotulo(i), { sticky: true, direction: "top", offset: [0, -6], className: "rotulo", opacity: .95 });
      const destacar = () => {
        mostrarInfo(i, arvore);
        if (!arvore) camada.setStyle({ weight: camada.options.pesoOriginal + 3 });
      };
      camada.on("mouseover", destacar);
      camada.on("click", destacar);
      if (!arvore) camada.on("mouseout", () => camada.setStyle({ weight: camada.options.pesoOriginal }));
    }

    function linha(g, opcoes, i) {
      const camada = L.polyline(g, { ...opcoes, pesoOriginal: opcoes.weight });
      ligarHover(camada, i);
      return camada;
    }

    function atualizar() {
      if (!D || agendado) return;
      agendado = true;
      setTimeout(() => {  // agrupa mudanças rápidas do controle deslizante
        agendado = false;
        const la = +el("la").value, N = +el("n").value;
        el("la_num").value = la; el("n_num").value = N;
        estado = distribuir(D.F, D.L, D.S[chaveSol()], ORDEM, la, N);

        camadas.plantadas.clearLayers();
        camadas.arvores.clearLayers();
        let arvores = 0, arestas = 0;
        for (const i of NO_RECORTE) {
          const k = estado.n[i];
          if (!k) continue;
          arvores += k; arestas++;
          const g = D.geom[i];
          linha(g, { renderer: render.planted, color: "#1a9641", weight: 4, opacity: .55 }, i).addTo(camadas.plantadas);
          // k árvores espaçadas igualmente ao longo da aresta (ilustrativo).
          for (let j = 0; j < k; j++) {
            const t = (j + .5) / k;
            const p = [g[0][0] + (g[g.length - 1][0] - g[0][0]) * t, g[0][1] + (g[g.length - 1][1] - g[0][1]) * t];
            const marcador = L.circleMarker(p, { renderer: render.trees, radius: 4.5, color: "#00441b", weight: 1.2, fillColor: "#1a9641", fillOpacity: .95 });
            ligarHover(marcador, i, j + 1);
            marcador.addTo(camadas.arvores);
          }
        }
        el("r_arvores").textContent = `${fmt(arvores)} de ${fmt(estado.plantadas)}`;
        el("r_arestas").textContent = `${fmt(arestas)} de ${fmt(NO_RECORTE.length)}`;
        if (selecionada) {
          const { i, arvore } = selecionada;
          mostrarInfo(i, arvore && arvore <= estado.n[i] ? arvore : null);
        }
      }, 30);
    }

    async function carregar() {
      const features = (await lerTopojson("arestas_plantio.topojson")).features;
      const chaves = Object.keys(features[0].properties).filter(k => /^s\d+$/.test(k));
      D = { F: [], L: [], id: [], geom: [], S: Object.fromEntries(chaves.map(k => [k, []])) };
      const area = RECORTE.pad(.05);
      features.forEach((f, i) => {
        const p = f.properties;
        D.F.push(p.F); D.L.push(p.L); D.id.push(p.id);
        for (const k of chaves) D.S[k].push(p[k]);
        const coords = f.geometry && f.geometry.coordinates;
        const g = coords && coords.length > 1 ? coords.map(([x, y]) => [y, x]) : null;
        D.geom.push(g);
        if (g && g.some(pt => area.contains(pt))) NO_RECORTE.push(i);
      });
      ORDEM = prepararOrdem(D.F);


      for (const i of NO_RECORTE) {
        const g = D.geom[i];
        linha(g, { renderer: render.base, color: "#7d8590", weight: 2, opacity: .75 }, i).addTo(camadas.base);
        const t = (Math.log10(D.F[i]) - LOG10_MIN) / (LOG10_MAX - LOG10_MIN);
        linha(g, { renderer: render.flow, color: corViridis(t), weight: 3, opacity: .9 }, i).addTo(camadas.fluxo);
      }
      status.element.innerHTML = `<span class="dica">${fmt(NO_RECORTE.length)} ruas com fluxo neste recorte.</span>`;
      atualizar();
    }

    for (const id of ["la", "n"]) el(id).addEventListener("input", atualizar);
    // Caixas numéricas: as setinhas e a digitação atualizam o mapa na hora.
    // O controle deslizante de N usa passo 1 para não arredondar o valor digitado.
    el("la_num").addEventListener("input", e => {
      const v = parseFloat(e.target.value);
      if (!(v > 0)) return;
      el("la").min = Math.min(1, v); el("la").value = v; atualizar();
    });
    el("n_num").addEventListener("input", e => {
      const v = parseInt(e.target.value, 10);
      if (!(v >= 0)) return;
      el("n").max = Math.max(10000, v); el("n").value = v; atualizar();
    });

    carregar().catch(error => {
      const download = location.protocol === "file:" || error instanceof TypeError && /fetch/i.test(error.message);
      status.element.textContent = download
        ? "Não foi possível baixar as arestas: abra pelo site publicado ou por um servidor local."
        : `Erro ao processar as arestas: ${error.message}`;
      console.error(error);
    });
  </script>
</body>
</html>
